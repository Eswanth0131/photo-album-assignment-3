<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Photo Album</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js"></script>
  <script defer src="sdk/lib/axios/dist/axios.standalone.js"></script>
  <script defer src="sdk/lib/CryptoJS/rollups/crypto-js.js"></script>
  <script defer src="sdk/lib/CryptoJS/components/enc-base64.js"></script>
  <script defer src="sdk/lib/url-template/url-template.js"></script>
  <script defer src="sdk/lib/apiGatewayCore/sigV4Client.js"></script>
  <script defer src="sdk/lib/apiGatewayCore/apiGatewayClient.js"></script>
  <script defer src="sdk/lib/apiGatewayCore/simpleHttpClient.js"></script>
  <script defer src="sdk/lib/apiGatewayCore/utils.js"></script>
  <script defer src="sdk/apigClient.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <span class="brand">Photo Album</span>
    <label class="access" for="api-key">Album API key
      <input id="api-key" type="password" autocomplete="off" spellcheck="false">
    </label>
  </header>
  <main>
    <div class="layout">
      <section class="search" aria-labelledby="search-title">
        <h1 id="search-title">Find a photo</h1>
        <form id="search-form">
          <label for="query">What should we look for?</label>
          <div class="search-controls">
            <input id="query" type="search" placeholder="Show me photos with trees and birds" maxlength="256" required>
            <button>Search</button>
          </div>
        </form>
      </section>
      <section class="upload" aria-labelledby="upload-title">
        <h2 id="upload-title">Add a photo</h2>
        <form id="upload-form">
          <label for="file">JPEG or PNG up to 10 MB</label>
          <input id="file" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" required>
          <label for="labels">Custom labels <span>(optional)</span></label>
          <input id="labels" placeholder="Sam, Sally" maxlength="1024" aria-describedby="labels-help">
          <small id="labels-help">Separate labels with commas.</small>
          <button>Upload photo</button>
          <p id="upload-status" class="status" role="status"></p>
        </form>
      </section>
      <section class="results-section" aria-labelledby="results-title">
        <h2 id="results-title">Search results</h2>
        <p id="search-status" class="status" role="status">Enter a label or describe the photos you want to find.</p>
        <ul id="results" class="results"></ul>
      </section>
    </div>
  </main>
</body>
</html>
